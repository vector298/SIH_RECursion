# Full stack: PostgreSQL + API, for machines with nothing installed locally.
#
#   docker compose up --build
#   docker compose exec api python -m app.seed --records 1500 --reset
#
# The API is then on http://localhost:8000 (docs at /docs) and the React app,
# run separately with `npm run dev`, finds it automatically.
#
# IF YOU ALREADY HAVE POSTGRESQL INSTALLED, you probably do not want this file.
# It runs its own database in a container, entirely separate from your local one
# — cases you create through the API land in the container's database, not
# yours. Running the backend directly against your existing database is simpler:
#
#   cd backend && uvicorn app.main:app --reload
#
# To use compose against a database on the host machine instead of the container
# one, drop the `db` service and set (Docker Desktop on Windows/macOS):
#
#   CASEINTEL_DATABASE_URL: postgresql+psycopg://postgres:PASSWORD@host.docker.internal:5432/personmatch

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caseintel
      POSTGRES_PASSWORD: caseintel
      POSTGRES_DB: caseintel
    volumes:
      - caseintel-db:/var/lib/postgresql/data
    ports:
      # Published on 5433, not 5432, so this does not collide with a PostgreSQL
      # already installed on the host. Connect to it from the host with:
      #   psql -h localhost -p 5433 -U caseintel caseintel
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseintel"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      CASEINTEL_DATABASE_URL: postgresql+psycopg://caseintel:caseintel@db:5432/caseintel
      # Optional — without it, structured extraction falls back to rules.
      CASEINTEL_GEMINI_API_KEY: ${CASEINTEL_GEMINI_API_KEY:-}
      CASEINTEL_CORS_ORIGINS: '["http://localhost:5173","http://localhost:4173"]'
    volumes:
      - caseintel-media:/srv/media
      - caseintel-models:/srv/models
    ports:
      - "8000:8000"

volumes:
  caseintel-db:
  caseintel-media:
  caseintel-models:
